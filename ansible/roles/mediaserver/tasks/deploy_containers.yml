---
- name: Ensure media directory exists
  file:
    path: "{{ data_directory }}/media"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure movies directory exists
  file:
    path: "{{ data_directory }}/media/movies"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure shows directory exists
  file:
    path: "{{ data_directory }}/media/shows"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure downloads directory exists
  file:
    path: "{{ data_directory }}/downloads"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure downloads completed directory exists
  file:
    path: "{{ data_directory }}/downloads/completed"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure downloads incomplete directory exists
  file:
    path: "{{ data_directory }}/downloads/incomplete"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure downloads torrents directory exists
  file:
    path: "{{ data_directory }}/downloads/torrents"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Check for legacy Jellyseerr container
  community.docker.docker_container_info:
    name: jellyseerr
  register: jellyseerr_container

- name: Stop legacy Jellyseerr container
  community.docker.docker_container:
    name: jellyseerr
    state: stopped
  when: jellyseerr_container.exists

- name: Check for legacy Jellyseerr config
  stat:
    path: "{{ docker_config_directory }}/jellyseerr"
  register: jellyseerr_config

- name: Migrate Jellyseerr config to Seerr
  command:
    cmd: cp -a "{{ docker_config_directory }}/jellyseerr" "{{ docker_config_directory }}/seerr"
    creates: "{{ docker_config_directory }}/seerr"
  when: jellyseerr_config.stat.exists

- name: Ensure Seerr config directory exists
  file:
    path: "{{ docker_config_directory }}/seerr"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    recurse: yes

- name: Upload docker-compose.yml template
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_config_directory }}/docker-compose.yml"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0644'

- name: Run docker-compose up
  community.docker.docker_compose_v2:
    project_src: "{{ docker_config_directory }}"
    state: present
    recreate: auto
    pull: always
    remove_orphans: yes
