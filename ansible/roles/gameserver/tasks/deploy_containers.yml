- name: Ensure etc-valheim directory exists
  file:
    path: "{{ data_directory }}/servers/valheim"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure opt-valheim directory exists
  file:
    path: "{{ docker_config_directory }}/opt-valheim"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure minecraft data directory exists
  file:
    path: "{{ data_directory }}/servers/mc"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure minecraft astral data directory exists
  file:
    path: "{{ data_directory }}/servers/mc-astral"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Ensure minecraft modpacks directory exists
  file:
    path: "{{ data_directory }}/servers/modpacks"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Upload docker-compose.yml template
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_config_directory }}/docker-compose.yml"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0644'

- name: Upload valheim.env
  template:
    src: valheim.env.j2
    dest: "{{ docker_config_directory }}/valheim.env"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0600'

- name: Upload Astral modpack zip
  ansible.builtin.copy:
    src: ./files/create-astral-server-pack-2_1_4c.zip
    dest: /data/servers/modpacks/create-astral-server-pack-2_1_4c.zip
    mode: '0600'

- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present

- name: Ensure rsync is installed
  ansible.builtin.package:
    name: rsync
    state: present

- name: Extract Astral server pack
  unarchive:
    src: /data/servers/modpacks/create-astral-server-pack-2_1_4c.zip
    dest: /data/servers/mc-astral
    remote_src: yes

- name: Check if Create-Astral folder exists
  ansible.builtin.stat:
    path: /data/servers/mc-astral/Create-Astral-v2.1.4c-server
  register: create_astral_folder

# - name: Move contents of Create-Astral folder into server root
#   ansible.builtin.shell: mv /data/servers/mc-astral/Create-Astral-v2.1.4c-server/* /data/servers/mc-astral/
#   when: create_astral_folder.stat.exists

- name: Copy contents of Create-Astral folder into server root, merging directories
  ansible.builtin.command:
    cmd: rsync -a /data/servers/mc-astral/Create-Astral-v2.1.4c-server/ /data/servers/mc-astral/
  when: create_astral_folder.stat.exists

- name: Remove leftover Create-Astral folder
  ansible.builtin.file:
    path: /data/servers/mc-astral/Create-Astral-v2.1.4c-server
    state: absent

- name: Fix ownership of server files
  ansible.builtin.file:
    path: /data/servers/mc-astral
    state: directory
    recurse: yes
    owner: 1000
    group: 1000
    mode: '0755'

- name: Set default route to WireGuard client LXC
  ansible.builtin.command: ip route replace default via 192.168.0.1

- name: Run docker-compose up
  community.docker.docker_compose_v2:
    project_src: "{{ docker_config_directory }}"
    state: present
    recreate: auto
    pull: always

- name: Set default route to WireGuard client LXC
  ansible.builtin.command: ip route replace default via 192.168.0.102
